services:
  ambiently:
    build:
      context: .
      dockerfile: Dockerfile
    image: ambiently:latest
    container_name: ambiently
    restart: unless-stopped
    ports:
      - "${AMBIENTLY_PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - TZ=${TZ:-America/Chicago}
      # Optional: Runtime Supabase Cloud Sync (no image rebuild required)
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      # Optional: Set to "true" ONLY on trusted home networks to allow LAN http:// or .local/.lan
      # calendar (.ics) and RSS feeds (e.g., Nextcloud, Radicale, Home Assistant, FreshRSS).
      - AMBIENTLY_ALLOW_PRIVATE_FEEDS=${AMBIENTLY_ALLOW_PRIVATE_FEEDS:-false}
    security_opt:
      - no-new-privileges:true
