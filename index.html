        <h1>Ambiently — Free Self-Hosted Smart Display &amp; Digital Family Calendar</h1>
        <p>
          Ambiently is an open-source, offline-first smart display and family command center Progressive Web App (PWA) built for wall-mounted monitors, tablets, iPads, and Raspberry Pi kiosks. It serves as a privacy-first alternative to DAKboard, Skylight Calendar, and Mango Display with zero subscriptions.
        </p>
        <h2>Core Features &amp; Widgets</h2>
        <ul>
          <li><strong>Multi-Canvas Freeform Corkboard:</strong> Create custom boards with Daylight and Dark themes, sticky notes, checklists, and auto-rotating kiosk carousels.</li>
          <li><strong>Unified Multi-Calendar Agenda &amp; Grid:</strong> Merge Google Calendar, Apple iCloud, and Outlook iCal / WebCal feeds with color-coded tags.</li>
          <li><strong>Multi-Source Ambient Photo Frame:</strong> Stream slideshows from Google Photos shared albums, Google Drive folders, Plex Media Servers, or local NAS folders with Ken Burns, Polaroid, and Collage modes.</li>
          <li><strong>Weather, World Clock &amp; RSS Newsstand:</strong> Live local weather forecasts, multi-city world timezone clocks, milestone countdowns, daily quotes, and adaptive multi-column RSS news feeds.</li>
          <li><strong>3-Tier Local-First Persistence:</strong> Instant IndexedDB storage, real-time Chromium PC file auto-sync (<code>ambiently-data.json</code>), and optional Supabase family cloud sync.</li>
          <li><strong>Kiosk Hardware Protection:</strong> Scheduled Night Mode with pixel-shifting OLED clock, Kid-Proof PIN locks, and auto-hiding idle cursor.</li>
        </ul>
        <p><a href="https://github.com/Genghis1227/ambiently">View Documentation &amp; Source Code on GitHub</a></p>
